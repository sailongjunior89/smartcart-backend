spring.application.name=backend
# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:smartcart}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIBERNATE / JPA SETTINGS
# ===============================
# 'update' automatically creates database tables based on the Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Author: Htet Nandar (Grace)
# ===============================
# SEED DATA (data.sql)
# ===============================
# 'always' is required so data.sql runs against a real MySQL datasource (default 'embedded'
# skips it). defer-datasource-initialization=true makes it run AFTER Hibernate creates the
# schema, instead of before (which would fail with "table doesn't exist").
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Author: Htet Nandar (Grace)
# ===============================
# AI MICROSERVICE (smartcart-ai-service, nested under this project)
# ===============================
ai.python-service.base-url=http://localhost:8001
ai.python-service.connect-timeout-seconds=5
ai.python-service.read-timeout-seconds=60

# Author: Junior
# ===============================
# JWT AUTHENTICATION
# ===============================
jwt.secret=myVeryLongSecretKey12345678901234567890
jwt.expiration-ms=300000

# Author: Junior
# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Author: Junior
# ===============================
# DEBUG LOGGING
# ===============================

logging.level.root=INFO
logging.level.nus.iss.smartcart.backend=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


#Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}